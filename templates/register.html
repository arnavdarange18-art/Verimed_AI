{% extends "base.html" %}
{% block content %}
<div class="py-6 sm:py-12 flex items-center justify-center min-h-[60vh]">
    <div class="w-full max-w-md bg-white p-5 sm:p-8 rounded-2xl sm:rounded-3xl border border-slate-100 shadow-xl shadow-blue-50/50">
        <div class="text-center mb-6">
            <div class="bg-emerald-600 text-white w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 sm:mb-4 shadow-lg shadow-emerald-200">
                <i class="fa-solid fa-user-plus text-xl sm:text-2xl"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-black text-slate-800">Create Your Account</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Set up your personal Health Passport in a minute.</p>
        </div>

        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider font-bold text-slate-400 mb-1.5">Full Name</label>
                <input type="text" name="name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500" placeholder="Jane Doe">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider font-bold text-slate-400 mb-1.5">Email</label>
                <input type="email" name="email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500" placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider font-bold text-slate-400 mb-1.5">Password</label>
                <input type="password" name="password" required minlength="8" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500" placeholder="At least 8 characters">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider font-bold text-slate-400 mb-1.5">Confirm Password</label>
                <input type="password" name="confirm_password" required minlength="8" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500" placeholder="Re-enter password">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl hover:bg-emerald-700 transition-colors shadow-lg shadow-emerald-200 text-sm">
                <i class="fa-solid fa-user-plus mr-2"></i>Create Account
            </button>
        </form>

        <p class="text-center text-xs sm:text-sm text-slate-500 mt-6">
            Already have an account? <a href="/login" class="text-blue-600 font-bold hover:underline">Log in here</a>
        </p>
    </div>
</div>
{% endblock %}
